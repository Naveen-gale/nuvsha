<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nuvsha App</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 700px; margin: 0 auto; }
      h1 { font-size: 2rem; margin-bottom: 1.5rem; color: #333; }
      h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #555; }
      section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      input { display: block; padding: 0.4rem 0.6rem; margin-bottom: 0.5rem; width: 100%; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
      button { padding: 0.4rem 1rem; margin-right: 0.4rem; background: #5b6af0; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
      button:hover { background: #4454e0; }
      .count { font-size: 2rem; font-weight: bold; margin-bottom: 0.5rem; }
      ul { padding-left: 1.2rem; margin-bottom: 0.5rem; }
      li { padding: 0.1rem 0; }
      p { margin: 0.4rem 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
